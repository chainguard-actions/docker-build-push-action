name: Test build with call option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-call || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/call"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/call/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "call check test"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/call
          file: tests/fixtures/call/Dockerfile
          tags: test-call:latest
          push: 'false'
          no-cache: 'true'
          call: check

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          # call=check may produce empty metadata; just verify the step completed
          echo "PASS: build call=check step completed successfully"
