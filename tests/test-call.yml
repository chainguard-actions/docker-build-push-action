name: Test Docker build with call input (check evaluation)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-call-ctx
          cat > /tmp/docker-call-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "call check test"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name call-builder || true

      - id: build
        uses: .
        with:
          context: /tmp/docker-call-ctx
          tags: test-call-image:latest
          push: 'false'
          no-cache: 'true'
          call: check

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"
