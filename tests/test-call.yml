name: Test build with call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx version || true
          docker buildx create --name test-builder-call --use --bootstrap 2>/dev/null || \
            docker buildx use test-builder-call 2>/dev/null || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: .
          file: tests/fixtures/Dockerfile.basic
          push: 'false'
          tags: test-call:latest
          call: check
          provenance: 'false'
          sbom: 'false'
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          # call=check performs a lint/check pass; metadata may be empty or set
          # The key assertion is that the step completed without error
          echo "PASS: build with call=check completed"
