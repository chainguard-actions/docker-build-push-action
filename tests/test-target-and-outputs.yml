name: Test target stage and output options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: build
        uses: .
        with:
          context: ${{ github.workspace }}/actions/hardened/docker--build-push-action/v7.2.0/tests/fixtures
          file: ${{ github.workspace }}/actions/hardened/docker--build-push-action/v7.2.0/tests/fixtures/Dockerfile.multistage
          tags: test-target:latest
          target: runtime
          load: 'true'
          push: 'false'
          provenance: 'false'
          sbom: 'false'
          annotations: ''
          attests: ''
          outputs: ''
          platforms: linux/amd64
      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid output to be non-empty"
            exit 1
          fi
          echo "PASS"
