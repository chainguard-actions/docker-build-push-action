name: Test build with ssh
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH agent with a test key
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f /tmp/test-ssh-key -N "" -C "test@example.com"
          ssh-add /tmp/test-ssh-key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Create Dockerfile that uses SSH
        run: |
          mkdir -p /tmp/ssh-ctx
          cat > /tmp/ssh-ctx/Dockerfile << 'EOF'
          FROM alpine:3.19
          RUN apk add --no-cache openssh-client
          RUN --mount=type=ssh echo "SSH mount available" > /ssh-check.txt
          CMD ["cat", "/ssh-check.txt"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        name: Build image with SSH forwarding
        uses: .
        continue-on-error: true
        with:
          context: /tmp/ssh-ctx
          load: 'true'
          push: 'false'
          tags: test-ssh:latest
          ssh: default=${{ env.SSH_AUTH_SOCK }}

      - name: Assert build ran (SSH may not be fully available in all environments)
        env:
          OUTCOME: ${{ steps.build.outcome }}
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "outcome: $OUTCOME"
          echo "imageid: $IMAGEID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$IMAGEID" ]; then
              echo "FAIL: build succeeded but imageid is empty"
              exit 1
            fi
            echo "PASS: build with SSH forwarding succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build with SSH forwarding failed gracefully (SSH may not be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
