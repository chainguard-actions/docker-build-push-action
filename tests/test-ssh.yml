name: Test ssh input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH agent with a test key
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f /tmp/test-ssh-key -N "" -q
          ssh-add /tmp/test-ssh-key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Create Dockerfile that uses SSH mount
        run: |
          mkdir -p /tmp/ssh-ctx
          cat > /tmp/ssh-ctx/Dockerfile << 'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.19
          RUN --mount=type=ssh \
              echo "SSH mount available (key may not be usable)" || true
          CMD ["echo", "hello"]
          EOF

      - id: build
        name: Build image with ssh input
        uses: .
        with:
          context: /tmp/ssh-ctx
          push: 'false'
          load: 'true'
          tags: test-ssh:latest
          ssh: 'default'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
