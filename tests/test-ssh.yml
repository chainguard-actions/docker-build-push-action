name: Test Docker build with ssh input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Docker Buildx is available
        run: docker buildx version

      - name: Set up SSH agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f /tmp/test-key -N ""
          ssh-add /tmp/test-key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - id: build
        uses: .
        with:
          context: tests/fixtures/simple
          tags: test-ssh:local
          push: 'false'
          load: 'true'
          no-cache: 'true'
          ssh: default

      - name: Assert image was loaded into Docker daemon
        run: |
          echo "Checking for loaded image..."
          if ! docker image inspect test-ssh:local > /dev/null 2>&1; then
            echo "FAIL: expected test-ssh:local to be present in Docker daemon"
            docker images
            exit 1
          fi
          echo "PASS: image test-ssh:local exists"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output was empty"
            exit 1
          fi
          echo "PASS"
