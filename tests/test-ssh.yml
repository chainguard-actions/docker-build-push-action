name: Test build with SSH agent forwarding
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH agent with a test key
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f /tmp/test-ssh-key -N "" -q
          ssh-add /tmp/test-ssh-key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Create a minimal Dockerfile for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/ssh"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/ssh/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN echo "ssh test - no actual ssh needed"
          CMD ["echo", "hello"]
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-ssh || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/ssh
          file: tests/fixtures/ssh/Dockerfile
          tags: test-ssh:latest
          load: 'true'
          push: 'false'
          ssh: default=${{ env.SSH_AUTH_SOCK }}

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid to be non-empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS: metadata is set"
