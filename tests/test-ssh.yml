name: Test build with SSH agent forwarding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-ssh || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/ssh"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/ssh/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "ssh forwarding test"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/ssh
          file: tests/fixtures/ssh/Dockerfile
          tags: test-ssh:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          ssh: default

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-ssh:latest > /dev/null 2>&1; then
            echo "FAIL: image test-ssh:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image is present in local Docker"
