name: Test build with SSH agent forwarding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile that uses SSH mount
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/ssh"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/ssh/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN apk add --no-cache openssh-client
          RUN --mount=type=ssh \
              echo "SSH socket available" && echo "ssh build test"
          EOF

      - name: Set up SSH agent with a test key
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f /tmp/test_ssh_key -N "" -q
          ssh-add /tmp/test_ssh_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-ssh || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/ssh
          file: tests/fixtures/ssh/Dockerfile
          load: 'true'
          push: 'false'
          tags: test-ssh:latest
          no-cache: 'true'
          ssh: default

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
