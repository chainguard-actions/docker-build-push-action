name: Test secrets and ssh inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Dockerfile and secret file
        run: |
          mkdir -p /tmp/docker-secret-ctx
          cat > /tmp/docker-secret-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "secrets build"
          EOF
          echo "mysecretvalue" > /tmp/mysecret.txt
      - id: build
        uses: .
        with:
          context: /tmp/docker-secret-ctx
          file: /tmp/docker-secret-ctx/Dockerfile
          tags: myimage:secrets-test
          secrets: |
            mysecret=mysecretvalue
          secret-envs: |
            MY_SECRET_ENV=HOME
          secret-files: |
            mysecretfile=/tmp/mysecret.txt
          ssh: ''
          load: 'true'
          push: 'false'
      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"
