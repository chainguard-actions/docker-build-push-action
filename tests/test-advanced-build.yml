name: Test Docker build with add-hosts, build-contexts, builder, no-cache-filters, and call
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile with named stage and build context
        run: |
          mkdir -p /tmp/docker-advanced-test
          mkdir -p /tmp/docker-extra-context
          echo "hello from extra context" > /tmp/docker-extra-context/hello.txt
          cat > /tmp/docker-advanced-test/Dockerfile <<'EOF'
          FROM alpine:3.18 AS base
          RUN echo "base stage"

          FROM base AS final
          COPY --from=extra /hello.txt /hello.txt
          CMD ["cat", "/hello.txt"]
          EOF

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        uses: .
        with:
          context: /tmp/docker-advanced-test
          file: /tmp/docker-advanced-test/Dockerfile
          tags: test-advanced:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          add-hosts: |
            myhost:127.0.0.1
          build-contexts: |
            extra=/tmp/docker-extra-context
          builder: ${{ steps.buildx.outputs.name }}
          no-cache-filters: base

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert build-context file is present in image
        run: |
          OUTPUT=$(docker run --rm test-advanced:latest)
          echo "container output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "hello from extra context"; then
            echo "FAIL: expected 'hello from extra context' in container output"
            exit 1
          fi
          echo "PASS"
