name: Test build with build-contexts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create additional build context
        run: |
          mkdir -p /tmp/extra-ctx
          echo "extra context file" > /tmp/extra-ctx/extra.txt
          mkdir -p /tmp/build-contexts-ctx
          cat > /tmp/build-contexts-ctx/Dockerfile << 'EOF'
          FROM alpine:3.19
          COPY --from=extra /extra.txt /extra.txt
          CMD ["cat", "/extra.txt"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        name: Build image with additional build contexts
        uses: .
        with:
          context: /tmp/build-contexts-ctx
          load: 'true'
          push: 'false'
          tags: test-build-contexts:latest
          build-contexts: extra=/tmp/extra-ctx

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert extra context file was included
        run: |
          OUTPUT=$(docker run --rm test-build-contexts:latest)
          echo "container output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "extra context file"; then
            echo "PASS: extra context file content found"
          else
            echo "FAIL: expected 'extra context file' in output, got: $OUTPUT"
            exit 1
          fi
