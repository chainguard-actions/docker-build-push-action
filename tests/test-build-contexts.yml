name: Test build with additional build contexts
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile and extra context for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/build-contexts/extra"
          echo "extra context file" > "$GITHUB_WORKSPACE/tests/fixtures/build-contexts/extra/data.txt"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/build-contexts/Dockerfile" <<'EOF'
          FROM alpine:3.18
          COPY --from=extra /data.txt /data.txt
          RUN cat /data.txt
          CMD ["echo", "hello"]
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-contexts || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/build-contexts
          file: tests/fixtures/build-contexts/Dockerfile
          tags: test-build-contexts:latest
          load: 'true'
          push: 'false'
          build-contexts: extra=tests/fixtures/build-contexts/extra

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid to be non-empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS: metadata is set"
