name: Test build with build-contexts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-bctx || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile and extra context
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/build-contexts/main"
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/build-contexts/extra"
          echo "extra-file-content" > "$GITHUB_WORKSPACE/tests/fixtures/build-contexts/extra/extra.txt"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/build-contexts/main/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          COPY --from=extractx /extra.txt /extra.txt
          RUN cat /extra.txt
          EOF
          mkdir -p "$GITHUB_WORKSPACE/tests/bctx-dest"

      - id: build
        uses: .
        with:
          context: tests/fixtures/build-contexts/main
          file: tests/fixtures/build-contexts/main/Dockerfile
          outputs: type=local,dest=tests/bctx-dest
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          build-contexts: extractx=tests/fixtures/build-contexts/extra

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
