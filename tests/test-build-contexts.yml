name: Test build-contexts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile and extra context
        run: |
          mkdir -p /tmp/docker-ctx
          mkdir -p /tmp/extra-ctx
          echo "extra file" > /tmp/extra-ctx/extra.txt
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          FROM alpine:3.19
          COPY --from=extra /extra.txt /extra.txt
          RUN cat /extra.txt
          EOF

      - id: action
        uses: .
        with:
          context: /tmp/docker-ctx
          push: 'false'
          load: 'true'
          tags: test-build-contexts:latest
          build-contexts: |
            extra=/tmp/extra-ctx
        continue-on-error: true

      - name: Assert build ran with build-contexts input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build succeeded with build-contexts"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (build-contexts may require specific buildx version)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
