name: Test Docker build with attestation inputs (attests, provenance, sbom)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-attest-ctx
          cat > /tmp/docker-attest-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "attestation test build"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name attest-builder || true

      - id: build
        uses: .
        with:
          context: /tmp/docker-attest-ctx
          tags: test-attest-image:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          sbom: 'false'
          attests: type=provenance,disabled=true

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"
