name: Test Docker build with provenance, sbom, attests, and annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile
        run: |
          mkdir -p /tmp/docker-attest-test
          cat > /tmp/docker-attest-test/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "attestation test build"
          CMD ["echo", "done"]
          EOF
          mkdir -p /tmp/docker-attest-output

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        uses: .
        with:
          context: /tmp/docker-attest-test
          file: /tmp/docker-attest-test/Dockerfile
          tags: test-attest:latest
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          sbom: 'false'
          attests: type=provenance,mode=min
          annotations: |
            index:org.opencontainers.image.description=Test image for attestation
          outputs: type=local,dest=/tmp/docker-attest-output

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert output directory is non-empty
        run: |
          COUNT=$(find /tmp/docker-attest-output -type f | wc -l)
          echo "Output file count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "FAIL: expected output files in /tmp/docker-attest-output"
            exit 1
          fi
          echo "PASS"
