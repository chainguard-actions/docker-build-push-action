name: Test Docker build with platforms input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-platforms-ctx
          cat > /tmp/docker-platforms-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "platforms test"
          EOF

      - name: Set up QEMU for multi-platform builds
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all || true

      - id: build
        uses: .
        with:
          context: /tmp/docker-platforms-ctx
          file: /tmp/docker-platforms-ctx/Dockerfile
          tags: test-platforms:latest
          push: 'false'
          platforms: linux/amd64
          outputs: type=docker,name=test-platforms:latest

      - name: Assert metadata is non-empty
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"
