name: Test build with platforms
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-platforms || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/platforms"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/platforms/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "platforms build test"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/tests/platforms-dest"

      - id: build
        uses: .
        with:
          context: tests/fixtures/platforms
          file: tests/fixtures/platforms/Dockerfile
          platforms: linux/amd64
          outputs: type=local,dest=tests/platforms-dest
          push: 'false'
          no-cache: 'true'
          provenance: 'false'

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
