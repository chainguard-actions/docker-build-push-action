name: Test Docker build with platforms input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Docker Buildx is available
        run: docker buildx version

      - name: Set up QEMU for multi-platform builds
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Create a buildx builder with multi-platform support
        run: |
          docker buildx create --name multiplatform-builder --use || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: tests/fixtures/simple
          tags: test-platforms:local
          push: 'false'
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/test-platforms.tar

      - name: Assert OCI tar was created
        run: |
          echo "Checking for OCI tar output..."
          if [ ! -f /tmp/test-platforms.tar ]; then
            echo "FAIL: expected /tmp/test-platforms.tar to exist"
            exit 1
          fi
          echo "PASS: OCI tar exists at /tmp/test-platforms.tar"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output was empty"
            exit 1
          fi
          echo "PASS"
