name: Test multi-platform build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/platforms"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/platforms/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN echo "multi-platform build test"
          EOF

      - name: Set up QEMU for multi-platform builds
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-platforms || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/platforms
          file: tests/fixtures/platforms/Dockerfile
          load: 'false'
          push: 'false'
          tags: test-platforms:latest
          no-cache: 'true'
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/test-platforms.tar

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert OCI tar was created
        run: |
          if [ ! -f /tmp/test-platforms.tar ]; then
            echo "FAIL: OCI tar output not found at /tmp/test-platforms.tar"
            exit 1
          fi
          echo "PASS: multi-platform OCI tar output exists"
