name: Test platforms input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-ctx
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          FROM alpine:3.19
          RUN echo "platforms test"
          EOF

      - id: action
        uses: .
        with:
          context: /tmp/docker-ctx
          push: 'false'
          outputs: 'type=tar,dest=/tmp/platforms-output.tar'
          tags: test-platforms:latest
          platforms: 'linux/amd64'
        continue-on-error: true

      - name: Assert build ran with platforms input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build succeeded with platforms=linux/amd64"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (multi-platform may not be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
