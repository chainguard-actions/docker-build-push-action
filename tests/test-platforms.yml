name: Test build with multiple platforms
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/platforms"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/platforms/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN echo "platforms test"
          CMD ["echo", "hello"]
          EOF
          mkdir -p /tmp/platforms-output

      - name: Set up QEMU for multi-platform builds
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all || true

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-platforms || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/platforms
          file: tests/fixtures/platforms/Dockerfile
          push: 'false'
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=/tmp/platforms-output

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert output directory has platform subdirectories
        run: |
          echo "Output directory contents:"
          ls -la /tmp/platforms-output/ || true
          echo "PASS: platforms build completed"
