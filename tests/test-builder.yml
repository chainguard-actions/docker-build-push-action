name: Test Docker build with explicit builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-builder-ctx
          cat > /tmp/docker-builder-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "builder test"
          EOF

      - name: Create a named Buildx builder
        run: |
          docker buildx create --name my-custom-builder --use

      - id: build
        uses: .
        with:
          context: /tmp/docker-builder-ctx
          tags: test-builder-image:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          builder: my-custom-builder

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-builder-image:latest > /dev/null 2>&1; then
            echo "FAIL: image test-builder-image:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image found in local Docker"
