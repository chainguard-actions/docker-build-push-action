name: Test builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up custom Docker Buildx builder
        id: setup-builder
        run: |
          docker buildx create --name custom-builder --use --bootstrap
          echo "builder=custom-builder" >> "$GITHUB_OUTPUT"

      - id: build
        uses: .
        with:
          context: tests/fixtures/basic
          file: tests/fixtures/basic/Dockerfile
          tags: test-builder:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          builder: custom-builder

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is present"

      - name: Cleanup custom builder
        if: always()
        run: |
          docker buildx rm custom-builder || true
