name: Test builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-ctx
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          FROM alpine:3.19
          RUN echo "builder test"
          EOF

      - name: Create a custom buildx builder
        id: create-builder
        run: |
          docker buildx create --name test-builder --use || true
          echo "builder=test-builder" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          context: /tmp/docker-ctx
          push: 'false'
          load: 'true'
          tags: test-builder:latest
          builder: test-builder
        continue-on-error: true

      - name: Assert build ran with builder input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build succeeded with custom builder"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (custom builder may not be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Cleanup builder
        if: always()
        run: docker buildx rm test-builder || true
