name: Test build with named builder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx with named builder
        run: |
          docker buildx create --name my-named-builder --use || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/builder"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/builder/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "named builder test"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/builder
          file: tests/fixtures/builder/Dockerfile
          tags: test-named-builder:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          builder: my-named-builder

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-named-builder:latest > /dev/null 2>&1; then
            echo "FAIL: image test-named-builder:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image is present in local Docker"
