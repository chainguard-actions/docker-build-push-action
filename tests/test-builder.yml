name: Test Docker build with builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom buildx builder
        run: |
          docker buildx create --name test-builder --use
          docker buildx inspect --bootstrap

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-builder-ctx
          cat > /tmp/docker-builder-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "builder test"
          EOF

      - id: build
        uses: .
        with:
          context: /tmp/docker-builder-ctx
          file: /tmp/docker-builder-ctx/Dockerfile
          tags: test-builder:latest
          load: 'true'
          push: 'false'
          builder: test-builder

      - name: Assert image was loaded
        run: |
          if ! docker image inspect test-builder:latest > /dev/null 2>&1; then
            echo "FAIL: image test-builder:latest not found in local Docker"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata is non-empty
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Clean up builder
        if: always()
        run: |
          docker buildx rm test-builder || true
