name: Test call and allow inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/call-allow-ctx
          cat > /tmp/call-allow-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "call allow test"
          EOF
      - id: action
        uses: .
        with:
          context: /tmp/call-allow-ctx
          push: 'false'
          call: check
          outputs: type=cacheonly
      - name: Assert step completed (call=check may produce empty metadata)
        env:
          IMAGEID: ${{ steps.action.outputs.imageid }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "imageid: $IMAGEID"
          echo "metadata: $METADATA"
          echo "PASS: action completed with call=check"
