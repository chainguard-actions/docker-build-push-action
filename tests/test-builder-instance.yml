name: Test build with explicit builder instance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create named builder instance
        run: |
          docker buildx create --name my-named-builder --use || true
          docker buildx inspect --bootstrap my-named-builder

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/builder"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/builder/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "builder instance test"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/builder
          file: tests/fixtures/builder/Dockerfile
          tags: test-builder-instance:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          builder: my-named-builder

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
