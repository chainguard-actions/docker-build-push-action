name: Test Docker build with advanced options (add-hosts, network, shm-size, ulimit, cgroup-parent)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-advanced-ctx
          cat > /tmp/docker-advanced-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "advanced options build"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name advanced-builder || true

      - id: build
        uses: .
        with:
          context: /tmp/docker-advanced-ctx
          tags: test-advanced-image:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          add-hosts: |
            myhost:127.0.0.1
          network: host
          shm-size: 128m
          ulimit: nofile=1024:1024
          cgroup-parent: ''

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-advanced-image:latest > /dev/null 2>&1; then
            echo "FAIL: image test-advanced-image:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image found in local Docker"
