name: Test Docker build with network and resource inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-network-ctx
          cat > /tmp/docker-network-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "network test"
          EOF

      - id: build
        uses: .
        with:
          context: /tmp/docker-network-ctx
          file: /tmp/docker-network-ctx/Dockerfile
          tags: test-network:latest
          load: 'true'
          push: 'false'
          add-hosts: myhost:127.0.0.1
          network: host
          shm-size: 128m
          cgroup-parent: ''
          ulimit: nofile=1024:1024

      - name: Assert image was loaded
        run: |
          if ! docker image inspect test-network:latest > /dev/null 2>&1; then
            echo "FAIL: image test-network:latest not found in local Docker"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata is non-empty
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"
