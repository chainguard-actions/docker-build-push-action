name: Test network and resource inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        name: Build image with network/resource options
        uses: .
        with:
          context: hardened/tests/fixtures
          file: hardened/tests/fixtures/Dockerfile
          load: 'true'
          push: 'false'
          tags: test-network-resources:latest
          add-hosts: 'myhost:127.0.0.1'
          network: 'host'
          shm-size: '128m'
          ulimit: 'nofile=1024:1024'
          cgroup-parent: ''

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-network-resources:latest > /dev/null 2>&1; then
            echo "FAIL: image test-network-resources:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image is present in local Docker"
