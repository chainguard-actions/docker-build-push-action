name: Test build with labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx version || true
          docker buildx create --name test-builder-labels --use --bootstrap 2>/dev/null || \
            docker buildx use test-builder-labels 2>/dev/null || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: .
          file: tests/fixtures/Dockerfile.labels
          load: 'true'
          push: 'false'
          tags: test-build-labels:latest
          labels: |
            org.opencontainers.image.title=Test Image
            org.opencontainers.image.version=1.0.0
            custom.label=test-value
          provenance: 'false'
          sbom: 'false'
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set to $IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert image labels are set correctly
        run: |
          TITLE=$(docker inspect test-build-labels:latest --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')
          echo "title label: $TITLE"
          if [ "$TITLE" != "Test Image" ]; then
            echo "FAIL: expected label 'org.opencontainers.image.title' to be 'Test Image', got '$TITLE'"
            exit 1
          fi
          CUSTOM=$(docker inspect test-build-labels:latest --format '{{ index .Config.Labels "custom.label" }}')
          echo "custom label: $CUSTOM"
          if [ "$CUSTOM" != "test-value" ]; then
            echo "FAIL: expected label 'custom.label' to be 'test-value', got '$CUSTOM'"
            exit 1
          fi
          echo "PASS: labels are set correctly"
