name: Test platforms and attestation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/plat-attest-ctx
          cat > /tmp/plat-attest-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "platforms attestations test"
          EOF
      - name: Set up QEMU for multi-platform
        uses: docker/setup-qemu-action@v3
        continue-on-error: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true
      - id: action
        uses: .
        with:
          context: /tmp/plat-attest-ctx
          push: 'false'
          platforms: linux/amd64
          annotations: index:org.opencontainers.image.description=Test image
          provenance: 'false'
          sbom: 'false'
          outputs: type=cacheonly
      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS"
