name: Test build with build-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-args || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile with ARG
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/buildargs"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/buildargs/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          ARG MY_VERSION=default
          ARG MY_ENV=production
          RUN echo "version=$MY_VERSION env=$MY_ENV" > /build-info.txt
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/buildargs
          file: tests/fixtures/buildargs/Dockerfile
          tags: test-build-args:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          build-args: |
            MY_VERSION=1.2.3
            MY_ENV=testing

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert build-args were applied
        run: |
          CONTENT=$(docker run --rm test-build-args:latest cat /build-info.txt)
          echo "build-info.txt content: $CONTENT"
          if echo "$CONTENT" | grep -q "version=1.2.3"; then
            echo "PASS: MY_VERSION build-arg was applied"
          else
            echo "FAIL: MY_VERSION build-arg was not applied, got: $CONTENT"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "env=testing"; then
            echo "PASS: MY_ENV build-arg was applied"
          else
            echo "FAIL: MY_ENV build-arg was not applied, got: $CONTENT"
            exit 1
          fi
