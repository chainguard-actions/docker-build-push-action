name: Test build with build-args
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile that uses build args
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/build-args"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/build-args/Dockerfile" <<'EOF'
          FROM alpine:3.18
          ARG APP_VERSION=unknown
          ARG APP_NAME=myapp
          RUN echo "Building $APP_NAME version $APP_VERSION" > /version.txt
          CMD ["cat", "/version.txt"]
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-args || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/build-args
          file: tests/fixtures/build-args/Dockerfile
          tags: test-build-args:latest
          load: 'true'
          push: 'false'
          build-args: |
            APP_VERSION=1.2.3
            APP_NAME=testapp

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid to be non-empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert build args were applied
        run: |
          OUTPUT=$(docker run --rm test-build-args:latest)
          echo "container output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "testapp" && echo "$OUTPUT" | grep -q "1.2.3"; then
            echo "PASS: build args were applied correctly"
          else
            echo "FAIL: expected build args to be applied, got: $OUTPUT"
            exit 1
          fi
