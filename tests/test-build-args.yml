name: Test build with build-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx version || true
          docker buildx create --name test-builder-args --use --bootstrap 2>/dev/null || \
            docker buildx use test-builder-args 2>/dev/null || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: .
          file: tests/fixtures/Dockerfile.buildargs
          load: 'true'
          push: 'false'
          tags: test-build-args:latest
          build-args: |
            MY_VERSION=1.2.3
            MY_ENV=testing
          provenance: 'false'
          sbom: 'false'
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty — build with build-args may have failed"
            exit 1
          fi
          echo "PASS: imageid is set to $IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-build-args:latest > /dev/null 2>&1; then
            echo "FAIL: image test-build-args:latest not found in Docker"
            exit 1
          fi
          echo "PASS: image found in Docker"
