name: Test build with build-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name mybuilder --use --bootstrap || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: tests/fixtures/build-args
          file: tests/fixtures/build-args/Dockerfile
          tags: test-build-args:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          build-args: |
            MY_VERSION=1.2.3
            MY_ENV=testing

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert build-args were applied
        run: |
          OUTPUT=$(docker run --rm test-build-args:latest cat /build-info.txt)
          echo "build-info: $OUTPUT"
          if echo "$OUTPUT" | grep -q "version=1.2.3"; then
            echo "PASS: MY_VERSION build-arg applied correctly"
          else
            echo "FAIL: MY_VERSION not found in build output: $OUTPUT"
            exit 1
          fi
          if echo "$OUTPUT" | grep -q "env=testing"; then
            echo "PASS: MY_ENV build-arg applied correctly"
          else
            echo "FAIL: MY_ENV not found in build output: $OUTPUT"
            exit 1
          fi
