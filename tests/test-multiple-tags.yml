name: Test build with multiple tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/multitag"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/multitag/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN echo "multi-tag test"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-multitag || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/multitag
          file: tests/fixtures/multitag/Dockerfile
          load: 'true'
          push: 'false'
          no-cache: 'true'
          tags: |
            test-multi-tag:latest
            test-multi-tag:1.0.0
            test-multi-tag:stable

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert all tags are present in Docker
        run: |
          for TAG in "test-multi-tag:latest" "test-multi-tag:1.0.0" "test-multi-tag:stable"; do
            if ! docker image inspect "$TAG" > /dev/null 2>&1; then
              echo "FAIL: image $TAG not found in local Docker"
              exit 1
            fi
            echo "PASS: image $TAG is present"
          done

      - name: Assert metadata contains tag information
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
