name: Test Docker build with attestation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-attest-ctx
          cat > /tmp/docker-attest-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "attestation test"
          EOF

      - id: build
        uses: .
        with:
          context: /tmp/docker-attest-ctx
          file: /tmp/docker-attest-ctx/Dockerfile
          tags: test-attest:latest
          load: 'true'
          push: 'false'
          provenance: 'false'
          sbom: 'false'
          annotations: |
            index:org.opencontainers.image.description=Test image

      - name: Assert image was loaded
        run: |
          if ! docker image inspect test-attest:latest > /dev/null 2>&1; then
            echo "FAIL: image test-attest:latest not found in local Docker"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata is non-empty
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"
