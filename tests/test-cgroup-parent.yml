name: Test build with cgroup-parent
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx version || true
          docker buildx create --name test-builder-cgroup --use --bootstrap 2>/dev/null || \
            docker buildx use test-builder-cgroup 2>/dev/null || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: .
          file: tests/fixtures/Dockerfile.network
          load: 'true'
          push: 'false'
          tags: test-cgroup-parent:latest
          cgroup-parent: /test-cgroup
          provenance: 'false'
          sbom: 'false'
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty — build with cgroup-parent may have failed"
            exit 1
          fi
          echo "PASS: imageid is set to $IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
