name: Test builder, secret-envs, and call inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_SECRET_ENV: supersecret123
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx and capture builder name
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/builder-ctx
          cat > /tmp/builder-ctx/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN --mount=type=secret,id=mysecret echo "secret-envs test"
          EOF
      - id: action
        uses: .
        with:
          context: /tmp/builder-ctx
          push: 'false'
          builder: ${{ steps.buildx.outputs.name }}
          secret-envs: mysecret=MY_SECRET_ENV
          outputs: type=cacheonly
      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS"
