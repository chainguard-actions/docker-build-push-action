name: Test build with annotations and add-hosts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-annotations || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/annotations"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/annotations/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "annotations build test"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/tests/annotations-dest"

      - id: build
        uses: .
        with:
          context: tests/fixtures/annotations
          file: tests/fixtures/annotations/Dockerfile
          outputs: type=local,dest=tests/annotations-dest
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          annotations: index:org.opencontainers.image.description=Test annotation
          add-hosts: testhost:127.0.0.1

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
