name: Test build with secrets options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile and secret file for secrets testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/secrets-build"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/secrets-build/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN --mount=type=secret,id=mysecret echo "secret available"
          CMD ["echo", "hello"]
          EOF
          echo "supersecretvalue" > /tmp/my-secret-file.txt

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-secrets || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/secrets-build
          file: tests/fixtures/secrets-build/Dockerfile
          tags: test-secrets:latest
          load: 'true'
          push: 'false'
          secrets: "mysecret=mysecretvalue"
          secret-envs: "mysecret=MY_SECRET_ENV"
          secret-files: "mysecret=/tmp/my-secret-file.txt"
        env:
          MY_SECRET_ENV: "envvalue"

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid to be non-empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS: metadata is set"
