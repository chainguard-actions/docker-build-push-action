name: Test network and security inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Dockerfile
        run: |
          mkdir -p /tmp/docker-net-ctx
          cat > /tmp/docker-net-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "network build"
          EOF
      - id: build
        uses: .
        with:
          context: /tmp/docker-net-ctx
          file: /tmp/docker-net-ctx/Dockerfile
          tags: myimage:network-test
          add-hosts: |
            myhost:127.0.0.1
          network: host
          shm-size: 128m
          ulimit: nofile=1024:1024
          cgroup-parent: ''
          load: 'true'
          push: 'false'
      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"
