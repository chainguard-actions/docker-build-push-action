name: Test build with ssh and ulimit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-ssh-ulimit || true
          docker buildx inspect --bootstrap

      - name: Set up SSH agent with a dummy key
        run: |
          eval "$(ssh-agent -s)"
          ssh-keygen -t ed25519 -f /tmp/test_ssh_key -N "" -q
          ssh-add /tmp/test_ssh_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/ssh-ulimit"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/ssh-ulimit/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "ssh and ulimit build test"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/ssh-ulimit
          file: tests/fixtures/ssh-ulimit/Dockerfile
          tags: test-ssh-ulimit:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          ulimit: nofile=1024:1024

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
