name: Test build with custom Dockerfile path and multiple tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create context with custom Dockerfile name
        run: |
          mkdir -p /tmp/docker-custom-ctx
          cat > /tmp/docker-custom-ctx/MyDockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "custom dockerfile test"
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: build
        uses: .
        with:
          context: /tmp/docker-custom-ctx
          file: /tmp/docker-custom-ctx/MyDockerfile
          tags: |
            test-custom-df:latest
            test-custom-df:1.0.0
          load: 'true'
          push: 'false'

      - name: Assert imageid is non-empty
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert first tag exists
        run: |
          docker image inspect test-custom-df:latest > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: image test-custom-df:latest not found"
            exit 1
          fi
          echo "PASS: test-custom-df:latest exists"

      - name: Assert second tag exists
        run: |
          docker image inspect test-custom-df:1.0.0 > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: image test-custom-df:1.0.0 not found"
            exit 1
          fi
          echo "PASS: test-custom-df:1.0.0 exists"

      - name: Assert metadata output is valid JSON
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata is empty"
            exit 1
          fi
          echo "$METADATA" | python3 -c "import sys, json; json.load(sys.stdin)" 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: metadata is not valid JSON"
            exit 1
          fi
          echo "PASS: metadata is valid JSON"
