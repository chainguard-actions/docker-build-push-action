name: Test build with labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-labels || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/labels"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/labels/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "labels test"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/labels
          file: tests/fixtures/labels/Dockerfile
          tags: test-labels:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          labels: |
            org.opencontainers.image.title=Test Image
            org.opencontainers.image.version=1.0.0
            custom.label=hello-world

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert labels were applied
        run: |
          TITLE=$(docker inspect test-labels:latest --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')
          VERSION=$(docker inspect test-labels:latest --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          CUSTOM=$(docker inspect test-labels:latest --format '{{ index .Config.Labels "custom.label" }}')
          echo "title: $TITLE"
          echo "version: $VERSION"
          echo "custom: $CUSTOM"
          if [ "$TITLE" != "Test Image" ]; then
            echo "FAIL: expected title 'Test Image', got '$TITLE'"
            exit 1
          fi
          if [ "$VERSION" != "1.0.0" ]; then
            echo "FAIL: expected version '1.0.0', got '$VERSION'"
            exit 1
          fi
          if [ "$CUSTOM" != "hello-world" ]; then
            echo "FAIL: expected custom label 'hello-world', got '$CUSTOM'"
            exit 1
          fi
          echo "PASS: all labels verified"

      - name: Assert metadata contains label info
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
