name: Test build with no-cache
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Dockerfile for no-cache testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/no-cache"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/no-cache/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN date > /build-time.txt
          CMD ["cat", "/build-time.txt"]
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-nocache || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/no-cache
          file: tests/fixtures/no-cache/Dockerfile
          tags: test-no-cache:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid to be non-empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert image was built and loaded
        run: |
          if ! docker image inspect test-no-cache:latest > /dev/null 2>&1; then
            echo "FAIL: image test-no-cache:latest not found in local Docker daemon"
            exit 1
          fi
          echo "PASS: image built with no-cache and loaded successfully"
