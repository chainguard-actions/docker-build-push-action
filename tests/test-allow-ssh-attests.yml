name: Test allow, ssh, and attests inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/allow-ssh-ctx
          cat > /tmp/allow-ssh-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "allow ssh test"
          EOF
      - name: Start SSH agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
      - id: action
        uses: .
        with:
          context: /tmp/allow-ssh-ctx
          push: 'false'
          allow: network.host
          outputs: type=cacheonly
      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS"
