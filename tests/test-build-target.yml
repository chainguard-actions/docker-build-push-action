name: Test build with target stage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx version || true
          docker buildx create --name test-builder-target --use --bootstrap 2>/dev/null || \
            docker buildx use test-builder-target 2>/dev/null || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: .
          file: tests/fixtures/Dockerfile.multistage
          load: 'true'
          push: 'false'
          tags: test-build-target:builder
          target: builder
          provenance: 'false'
          sbom: 'false'
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty — target stage build may have failed"
            exit 1
          fi
          echo "PASS: imageid is set to $IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert target stage image was loaded and contains expected content
        run: |
          if ! docker image inspect test-build-target:builder > /dev/null 2>&1; then
            echo "FAIL: image test-build-target:builder not found in Docker"
            exit 1
          fi
          CONTENT=$(docker run --rm test-build-target:builder cat /stage.txt)
          echo "stage.txt content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "builder stage"; then
            echo "FAIL: expected 'builder stage' in /stage.txt, got: $CONTENT"
            exit 1
          fi
          echo "PASS: target stage built correctly"
