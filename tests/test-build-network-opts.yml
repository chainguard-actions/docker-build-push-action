name: Test build network and resource options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-ctx
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          FROM alpine:3.19
          RUN echo "hello"
          EOF

      - id: action
        uses: .
        with:
          context: /tmp/docker-ctx
          push: 'false'
          load: 'true'
          tags: test-network-opts:latest
          network: host
          add-hosts: |
            myhost:127.0.0.1
          cgroup-parent: ''
          shm-size: '128m'
          ulimit: 'nofile=1024:1024'
        continue-on-error: true

      - name: Assert build ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build succeeded with network/resource options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (expected in constrained environments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
