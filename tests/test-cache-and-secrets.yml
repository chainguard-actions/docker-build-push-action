name: Test cache and secrets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_SECRET_VAR: supersecret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create secret file
        run: |
          echo "mysecretvalue" > /tmp/test-secret.txt
      - id: build
        uses: .
        with:
          context: ${{ github.workspace }}/actions/hardened/docker--build-push-action/v7.2.0/tests/fixtures
          file: ${{ github.workspace }}/actions/hardened/docker--build-push-action/v7.2.0/tests/fixtures/Dockerfile
          tags: test-cache-secrets:latest
          load: 'true'
          push: 'false'
          cache-from: ''
          cache-to: ''
          build-contexts: ''
          allow: ''
          call: ''
          secrets: |
            mysecret=mysecretvalue
          secret-envs: |
            MY_SECRET=MY_SECRET_VAR
          secret-files: |
            mysecretfile=/tmp/test-secret.txt
          ssh: ''
          builder: ''
      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid output to be non-empty"
            exit 1
          fi
          echo "PASS"
