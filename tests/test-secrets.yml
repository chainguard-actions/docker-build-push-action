name: Test secrets, secret-envs, and secret-files inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name mybuilder --use --bootstrap || true
          docker buildx inspect --bootstrap

      - name: Prepare secret file
        run: |
          cp tests/fixtures/secrets/secret.txt /tmp/test-secret.txt

      - id: build
        uses: .
        env:
          MY_SECRET_ENV: supersecretvalue
        with:
          context: tests/fixtures/secrets
          file: tests/fixtures/secrets/Dockerfile
          tags: test-secrets:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          secrets: |
            mysecret=inlinevalue
          secret-envs: |
            MY_SECRET_ENV
          secret-files: |
            secretfile=/tmp/test-secret.txt

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is present"
