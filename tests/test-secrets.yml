name: Test build with secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-secrets || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile and secret file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/secrets"
          echo "my-secret-value" > /tmp/mysecretfile.txt
          cat > "$GITHUB_WORKSPACE/tests/fixtures/secrets/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN --mount=type=secret,id=mysecret \
              cat /run/secrets/mysecret > /dev/null && echo "secret mounted"
          RUN --mount=type=secret,id=myfilekey \
              cat /run/secrets/myfilekey > /dev/null && echo "file secret mounted"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/secrets
          file: tests/fixtures/secrets/Dockerfile
          tags: test-secrets:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'
          secrets: |
            mysecret=my-inline-secret
          secret-envs: |
            mysecret=MY_SECRET_ENV
          secret-files: |
            myfilekey=/tmp/mysecretfile.txt
        env:
          MY_SECRET_ENV: my-env-secret-value

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
