name: Test build with secrets (secrets, secret-envs, secret-files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile and secret file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/secrets"
          echo "mysecretvalue" > /tmp/my-secret-file.txt
          cat > "$GITHUB_WORKSPACE/tests/fixtures/secrets/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN --mount=type=secret,id=mysecret \
              cat /run/secrets/mysecret > /dev/null && echo "secret mounted"
          RUN --mount=type=secret,id=myenvsecret \
              cat /run/secrets/myenvsecret > /dev/null && echo "env secret mounted"
          RUN --mount=type=secret,id=myfilesecret \
              cat /run/secrets/myfilesecret > /dev/null && echo "file secret mounted"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-secrets || true

      - id: build
        uses: .
        env:
          MY_SECRET_ENV: secretenvvalue
        with:
          context: tests/fixtures/secrets
          file: tests/fixtures/secrets/Dockerfile
          load: 'true'
          push: 'false'
          tags: test-secrets:latest
          no-cache: 'true'
          secrets: |
            mysecret=mysecretvalue
          secret-envs: |
            myenvsecret=MY_SECRET_ENV
          secret-files: |
            myfilesecret=/tmp/my-secret-file.txt

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
