name: Test Docker build with secrets (secrets, secret-envs, secret-files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_SECRET_ENV: supersecretvalue
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile that uses secrets and secret files
        run: |
          mkdir -p /tmp/docker-secrets-ctx
          echo "filecontents" > /tmp/my-secret-file.txt
          cat > /tmp/docker-secrets-ctx/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN --mount=type=secret,id=mysecret echo "secret mounted"
          RUN --mount=type=secret,id=myfilekey echo "file secret mounted"
          RUN echo "secrets test done"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name secrets-builder || true

      - id: build
        uses: .
        with:
          context: /tmp/docker-secrets-ctx
          tags: test-secrets-image:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          secrets: mysecret=topsecret
          secret-envs: mysecret=MY_SECRET_ENV
          secret-files: myfilekey=/tmp/my-secret-file.txt

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-secrets-image:latest > /dev/null 2>&1; then
            echo "FAIL: image test-secrets-image:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image found in local Docker"
