name: Test secrets, secret-envs, and secret-files inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile and secret file
        run: |
          mkdir -p /tmp/docker-ctx
          echo "mysecretvalue" > /tmp/test-secret.txt
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.19
          RUN --mount=type=secret,id=mysecret cat /run/secrets/mysecret || echo "no secret"
          RUN --mount=type=secret,id=myenvsecret cat /run/secrets/myenvsecret || echo "no env secret"
          RUN --mount=type=secret,id=myfilesecret cat /run/secrets/myfilesecret || echo "no file secret"
          EOF

      - name: Set secret env var
        run: echo "MY_SECRET_ENV=secretenvvalue" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          context: /tmp/docker-ctx
          push: 'false'
          load: 'true'
          tags: test-secrets:latest
          secrets: |
            mysecret=mysecretvalue
          secret-envs: |
            myenvsecret=MY_SECRET_ENV
          secret-files: |
            myfilesecret=/tmp/test-secret.txt
        continue-on-error: true

      - name: Assert build ran with secrets inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build succeeded with secrets/secret-envs/secret-files"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (secrets may require specific buildx version)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
