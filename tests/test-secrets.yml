name: Test Docker build with secrets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile and secret file
        run: |
          mkdir -p /tmp/docker-secrets-ctx
          echo "mysecretvalue" > /tmp/my-secret-file.txt
          cat > /tmp/docker-secrets-ctx/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN --mount=type=secret,id=my_secret \
              cat /run/secrets/my_secret > /dev/null && echo "secret mounted"
          RUN --mount=type=secret,id=file_secret \
              cat /run/secrets/file_secret > /dev/null && echo "file secret mounted"
          EOF

      - id: build
        uses: .
        with:
          context: /tmp/docker-secrets-ctx
          file: /tmp/docker-secrets-ctx/Dockerfile
          tags: test-secrets:latest
          load: 'true'
          push: 'false'
          secrets: my_secret=supersecretvalue
          secret-envs: MY_SECRET_ENV=MY_SECRET_ENV
          secret-files: file_secret=/tmp/my-secret-file.txt
        env:
          MY_SECRET_ENV: envvalue

      - name: Assert image was loaded
        run: |
          if ! docker image inspect test-secrets:latest > /dev/null 2>&1; then
            echo "FAIL: image test-secrets:latest not found in local Docker"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata is non-empty
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"
