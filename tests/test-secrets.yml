name: Test secrets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Create secret file and Dockerfile that uses secrets
        run: |
          mkdir -p /tmp/secrets-ctx
          echo "mysecretvalue" > /tmp/my-secret-file.txt
          cat > /tmp/secrets-ctx/Dockerfile << 'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.19
          RUN --mount=type=secret,id=mysecret \
              cat /run/secrets/mysecret || true
          RUN --mount=type=secret,id=myfilesecret \
              cat /run/secrets/myfilesecret || true
          CMD ["echo", "hello"]
          EOF

      - id: build
        name: Build image with secrets, secret-envs, and secret-files
        uses: .
        env:
          MY_SECRET_ENV: mysecretenvvalue
        with:
          context: /tmp/secrets-ctx
          push: 'false'
          load: 'true'
          tags: test-secrets:latest
          secrets: 'mysecret=mysecretvalue'
          secret-envs: 'mysecret=MY_SECRET_ENV'
          secret-files: 'myfilesecret=/tmp/my-secret-file.txt'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
