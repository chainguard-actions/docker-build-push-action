name: Test build with no-cache-filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multi-stage Dockerfile for no-cache-filters test
        run: |
          mkdir -p /tmp/no-cache-filters-ctx
          cat > /tmp/no-cache-filters-ctx/Dockerfile << 'EOF'
          FROM alpine:3.19 AS deps
          RUN echo "deps stage" > /deps.txt

          FROM deps AS app
          RUN echo "app stage" > /app.txt
          CMD ["sh", "-c", "cat /deps.txt && cat /app.txt"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        name: Build image with no-cache-filters on deps stage
        uses: .
        with:
          context: /tmp/no-cache-filters-ctx
          load: 'true'
          push: 'false'
          tags: test-no-cache-filters:latest
          no-cache-filters: deps

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert image runs correctly
        run: |
          OUTPUT=$(docker run --rm test-no-cache-filters:latest)
          echo "container output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "deps stage"; then
            echo "PASS: deps stage content found"
          else
            echo "FAIL: expected 'deps stage' in output, got: $OUTPUT"
            exit 1
          fi
