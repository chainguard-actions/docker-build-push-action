name: Test build with no-cache-filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-nocachefilters || true
          docker buildx inspect --bootstrap

      - name: Write multi-stage Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/no-cache-filters"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/no-cache-filters/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18 AS base
          RUN echo "base stage"

          FROM base AS final
          RUN echo "final stage"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/no-cache-filters
          file: tests/fixtures/no-cache-filters/Dockerfile
          tags: test-no-cache-filters:latest
          load: 'true'
          push: 'false'
          no-cache: 'false'
          provenance: 'false'
          no-cache-filters: final
          allow: network.host

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
