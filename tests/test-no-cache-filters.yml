name: Test no-cache-filters input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multi-stage Dockerfile
        run: |
          mkdir -p /tmp/docker-ctx
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          FROM alpine:3.19 AS builder
          RUN echo "build stage"

          FROM alpine:3.19 AS final
          COPY --from=builder /etc/alpine-release /alpine-release
          RUN cat /alpine-release
          EOF

      - id: action
        uses: .
        with:
          context: /tmp/docker-ctx
          push: 'false'
          load: 'true'
          tags: test-no-cache-filters:latest
          no-cache-filters: |
            builder
        continue-on-error: true

      - name: Assert build ran with no-cache-filters input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build succeeded with no-cache-filters"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
