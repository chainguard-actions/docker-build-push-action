name: Test build with allow and no-cache-filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-allow || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile with multiple stages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/allow"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/allow/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18 AS base
          RUN echo "base stage"
          FROM alpine:3.18 AS final
          COPY --from=base /etc/alpine-release /etc/alpine-release
          RUN echo "final stage"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/allow
          file: tests/fixtures/allow/Dockerfile
          tags: test-allow-build:latest
          load: 'true'
          push: 'false'
          provenance: 'false'
          no-cache-filters: base
          allow: fs.read,fs.write

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
