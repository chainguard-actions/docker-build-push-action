name: Test build with target stage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-target || true
          docker buildx inspect --bootstrap

      - name: Write multi-stage Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/target/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18 AS builder
          RUN echo "builder stage" > /stage.txt

          FROM alpine:3.18 AS runtime
          COPY --from=builder /stage.txt /stage.txt
          RUN echo "runtime stage" >> /stage.txt
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/target
          file: tests/fixtures/target/Dockerfile
          tags: test-target-stage:latest
          target: builder
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert only builder stage was built
        run: |
          # The builder stage only has "builder stage" in stage.txt
          CONTENT=$(docker run --rm test-target-stage:latest cat /stage.txt)
          echo "stage.txt content: $CONTENT"
          if echo "$CONTENT" | grep -q "builder stage"; then
            echo "PASS: builder stage content found"
          else
            echo "FAIL: builder stage content not found, got: $CONTENT"
            exit 1
          fi
          # The runtime stage content should NOT be present since we stopped at builder
          if echo "$CONTENT" | grep -q "runtime stage"; then
            echo "FAIL: runtime stage content found but should not be (target=builder)"
            exit 1
          fi
          echo "PASS: target stage correctly limited to builder"
