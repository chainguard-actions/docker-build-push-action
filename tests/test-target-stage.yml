name: Test Docker build with target stage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Docker Buildx is available
        run: docker buildx version

      - id: build
        uses: .
        with:
          context: tests/fixtures/multistage
          tags: test-target:local
          push: 'false'
          load: 'true'
          no-cache: 'true'
          target: base

      - name: Assert image was loaded into Docker daemon
        run: |
          echo "Checking for loaded image..."
          if ! docker image inspect test-target:local > /dev/null 2>&1; then
            echo "FAIL: expected test-target:local to be present in Docker daemon"
            docker images
            exit 1
          fi
          echo "PASS: image test-target:local exists"

      - name: Assert only base stage content is present
        run: |
          OUTPUT=$(docker run --rm test-target:local cat /stage.txt)
          echo "Container output: $OUTPUT"
          if [ "$OUTPUT" != "base stage" ]; then
            echo "FAIL: expected 'base stage', got '$OUTPUT'"
            exit 1
          fi
          echo "PASS: target stage 'base' was built correctly"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output was empty"
            exit 1
          fi
          echo "PASS"
