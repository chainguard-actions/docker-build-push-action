name: Test Docker build with target stage (multi-stage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multi-stage Dockerfile
        run: |
          mkdir -p /tmp/docker-target-ctx
          cat > /tmp/docker-target-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18 AS builder
          RUN echo "builder-stage" > /stage.txt

          FROM alpine:3.18 AS final
          COPY --from=builder /stage.txt /stage.txt
          RUN echo "final-stage" >> /stage.txt
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name target-builder || true

      - id: build
        uses: .
        with:
          context: /tmp/docker-target-ctx
          tags: test-target-image:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          target: builder

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert only builder stage was built (no final-stage content)
        run: |
          CONTENT=$(docker run --rm test-target-image:latest cat /stage.txt)
          echo "stage.txt content: $CONTENT"
          if echo "$CONTENT" | grep -q "builder-stage"; then
            echo "PASS: builder-stage content found"
          else
            echo "FAIL: builder-stage content not found"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "final-stage"; then
            echo "FAIL: final-stage content found — target stage was not respected"
            exit 1
          fi
          echo "PASS: target stage correctly stopped at builder"
