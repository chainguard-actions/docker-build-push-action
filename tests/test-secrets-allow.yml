name: Test secrets and allow inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal Dockerfile and secret file
        run: |
          mkdir -p /tmp/secrets-ctx
          echo "mysecretvalue" > /tmp/secret.txt
          cat > /tmp/secrets-ctx/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN --mount=type=secret,id=mysecret cat /run/secrets/mysecret || true
          RUN echo "secrets test"
          EOF
      - id: action
        uses: .
        with:
          context: /tmp/secrets-ctx
          push: 'false'
          secrets: mysecret=mysecretvalue
          secret-files: mysecret=/tmp/secret.txt
          outputs: type=cacheonly
      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS"
