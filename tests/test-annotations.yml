name: Test build with annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/annotations"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/annotations/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN echo "annotations build test"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-annotations || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/annotations
          file: tests/fixtures/annotations/Dockerfile
          load: 'true'
          push: 'false'
          tags: test-annotations:latest
          no-cache: 'true'
          annotations: |
            org.opencontainers.image.description=Test annotation description
            org.opencontainers.image.vendor=TestVendor

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
