name: Test build with annotations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        name: Build image with annotations
        uses: .
        with:
          context: tests/fixtures
          file: tests/fixtures/Dockerfile
          push: 'false'
          outputs: type=local,dest=/tmp/annotations-output
          annotations: |
            org.opencontainers.image.description=Test image built by act
            org.opencontainers.image.vendor=Test Vendor

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
