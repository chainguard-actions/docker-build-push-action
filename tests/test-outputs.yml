name: Test Docker build outputs (imageid and metadata)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-outputs-ctx
          cat > /tmp/docker-outputs-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          LABEL test.scenario="outputs"
          EOF

      - id: build
        uses: .
        with:
          context: /tmp/docker-outputs-ctx
          file: /tmp/docker-outputs-ctx/Dockerfile
          tags: test-outputs:latest
          load: 'true'
          push: 'false'

      - name: Assert imageid output is non-empty
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata output contains ContainerConfig or config
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          # metadata should be valid JSON
          if ! echo "$METADATA" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: metadata is not valid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert no-cache flag works (build completes without error)
        run: |
          echo "Build with no-cache completed successfully"
          echo "PASS"
