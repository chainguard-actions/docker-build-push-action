name: Test build with local output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Dockerfile that produces a file artifact
        run: |
          mkdir -p /tmp/local-output-ctx
          cat > /tmp/local-output-ctx/Dockerfile <<'EOF'
          FROM scratch
          COPY artifact.txt /artifact.txt
          EOF
          echo "build artifact content" > /tmp/local-output-ctx/artifact.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: build
        name: Build image with local output
        uses: .
        with:
          context: /tmp/local-output-ctx
          push: 'false'
          outputs: type=local,dest=/tmp/local-output-result

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert local output artifact exists
        run: |
          if [ ! -f /tmp/local-output-result/artifact.txt ]; then
            echo "FAIL: expected artifact.txt not found in local output"
            ls -la /tmp/local-output-result/ || true
            exit 1
          fi
          CONTENT=$(cat /tmp/local-output-result/artifact.txt)
          echo "artifact content: $CONTENT"
          if [ "$CONTENT" != "build artifact content" ]; then
            echo "FAIL: unexpected artifact content: $CONTENT"
            exit 1
          fi
          echo "PASS: local output artifact is correct"
