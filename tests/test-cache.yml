name: Test build with cache settings (cache-from, cache-to, no-cache-filters)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a multi-stage Dockerfile for cache testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cache"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cache/Dockerfile" <<'EOF'
          FROM alpine:3.18 AS base
          RUN echo "base stage"

          FROM base AS final
          RUN echo "final stage"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-cache || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/cache
          file: tests/fixtures/cache/Dockerfile
          load: 'true'
          push: 'false'
          tags: test-cache:latest
          cache-from: type=local,src=/tmp/buildx-cache-in
          cache-to: type=local,dest=/tmp/buildx-cache-out,mode=max
          no-cache-filters: base

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
