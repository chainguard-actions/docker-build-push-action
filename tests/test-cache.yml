name: Test build with cache-from and cache-to
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-cache || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile and prepare cache dirs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cache"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cache/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "cache build test"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/tests/cache-store"
          mkdir -p "$GITHUB_WORKSPACE/tests/cache-dest"

      - name: Prime the cache
        run: |
          docker buildx build \
            --cache-to type=local,dest="$GITHUB_WORKSPACE/tests/cache-store",mode=max \
            --file "$GITHUB_WORKSPACE/tests/fixtures/cache/Dockerfile" \
            --no-cache \
            "$GITHUB_WORKSPACE/tests/fixtures/cache"

      - id: build
        uses: .
        with:
          context: tests/fixtures/cache
          file: tests/fixtures/cache/Dockerfile
          outputs: type=local,dest=tests/cache-dest
          push: 'false'
          provenance: 'false'
          cache-from: type=local,src=tests/cache-store
          cache-to: type=local,dest=tests/cache-store,mode=max

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
