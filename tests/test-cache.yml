name: Test cache-from and cache-to inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-ctx
          mkdir -p /tmp/docker-cache
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          FROM alpine:3.19
          RUN echo "cache test"
          EOF

      - id: action
        uses: .
        with:
          context: /tmp/docker-ctx
          push: 'false'
          load: 'true'
          tags: test-cache:latest
          cache-from: 'type=local,src=/tmp/docker-cache'
          cache-to: 'type=local,dest=/tmp/docker-cache,mode=max'
        continue-on-error: true

      - name: Assert build ran with cache inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          METADATA: ${{ steps.action.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build succeeded with cache-from/cache-to"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (local cache may not be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
