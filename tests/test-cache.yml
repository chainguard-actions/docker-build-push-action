name: Test cache inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Dockerfile with stages
        run: |
          mkdir -p /tmp/docker-cache-ctx
          cat > /tmp/docker-cache-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18 AS base
          RUN echo "base stage"
          FROM base AS final
          RUN echo "final stage"
          EOF
      - id: build
        uses: .
        with:
          context: /tmp/docker-cache-ctx
          file: /tmp/docker-cache-ctx/Dockerfile
          tags: myimage:cache-test
          cache-from: type=local,src=/tmp/buildx-cache-src
          cache-to: type=local,dest=/tmp/buildx-cache-dest,mode=max
          no-cache-filters: base
          load: 'true'
          push: 'false'
      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"
