name: Test Docker build with cache inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Docker Buildx is available
        run: docker buildx version

      - name: Create cache directory
        run: mkdir -p /tmp/buildx-cache

      - id: build
        uses: .
        with:
          context: tests/fixtures/simple
          tags: test-cache:local
          push: 'false'
          load: 'true'
          no-cache: 'false'
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache,mode=max

      - name: Assert image was loaded into Docker daemon
        run: |
          echo "Checking for loaded image..."
          if ! docker image inspect test-cache:local > /dev/null 2>&1; then
            echo "FAIL: expected test-cache:local to be present in Docker daemon"
            docker images
            exit 1
          fi
          echo "PASS: image test-cache:local exists"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output was empty"
            exit 1
          fi
          echo "PASS"
