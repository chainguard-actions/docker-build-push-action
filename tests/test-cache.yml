name: Test build with cache options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-cache || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cache"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cache/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "cache test"
          EOF
          mkdir -p /tmp/docker-cache

      - id: build
        uses: .
        with:
          context: tests/fixtures/cache
          file: tests/fixtures/cache/Dockerfile
          tags: test-cache:latest
          load: 'true'
          push: 'false'
          no-cache: 'false'
          provenance: 'false'
          cache-to: type=local,dest=/tmp/docker-cache,mode=max
          cache-from: type=local,src=/tmp/docker-cache

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"
