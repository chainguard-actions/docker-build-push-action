name: Test build with cache-from and cache-to
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Dockerfile for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cache"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cache/Dockerfile" <<'EOF'
          FROM alpine:3.18
          RUN echo "cache test"
          CMD ["echo", "hello"]
          EOF
          mkdir -p /tmp/buildx-cache-src /tmp/buildx-cache-dest

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-cache || true

      - id: build
        uses: .
        with:
          context: tests/fixtures/cache
          file: tests/fixtures/cache/Dockerfile
          tags: test-cache:latest
          load: 'true'
          push: 'false'
          cache-from: type=local,src=/tmp/buildx-cache-src
          cache-to: type=local,dest=/tmp/buildx-cache-dest,mode=max

      - name: Assert imageid output is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: expected imageid to be non-empty"
            exit 1
          fi
          echo "PASS: imageid is set"

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata to be non-empty"
            exit 1
          fi
          echo "PASS: metadata is set"
