name: Test basic build (load, no push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name mybuilder --use --bootstrap || true
          docker buildx inspect --bootstrap

      - id: build
        uses: .
        with:
          context: tests/fixtures/basic
          file: tests/fixtures/basic/Dockerfile
          tags: test-basic:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is present"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-basic:latest > /dev/null 2>&1; then
            echo "FAIL: image test-basic:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image loaded successfully"
