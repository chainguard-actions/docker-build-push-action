name: Test basic build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder || true
          docker buildx inspect --bootstrap

      - name: Write test Dockerfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/basic"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM alpine:3.18
          RUN echo "Hello from basic build test"
          EOF

      - id: build
        uses: .
        with:
          context: tests/fixtures/basic
          file: tests/fixtures/basic/Dockerfile
          tags: test-basic-build:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'
          provenance: 'false'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS: imageid=$IMAGEID"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata is set"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-basic-build:latest > /dev/null 2>&1; then
            echo "FAIL: image test-basic-build:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image is present in local Docker"
