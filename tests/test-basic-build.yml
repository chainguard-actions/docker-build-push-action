name: Test basic Docker build (load only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Dockerfile
        run: |
          mkdir -p /tmp/docker-test-ctx
          cat > /tmp/docker-test-ctx/Dockerfile <<'EOF'
          FROM alpine:3.18
          RUN echo "hello from build"
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder || true

      - id: build
        uses: .
        with:
          context: /tmp/docker-test-ctx
          tags: test-basic-image:latest
          load: 'true'
          push: 'false'
          no-cache: 'true'

      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect test-basic-image:latest > /dev/null 2>&1; then
            echo "FAIL: image test-basic-image:latest not found in local Docker"
            exit 1
          fi
          echo "PASS: image found in local Docker"
