name: Test basic build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Dockerfile
        run: |
          mkdir -p /tmp/docker-ctx
          cat > /tmp/docker-ctx/Dockerfile <<'EOF'
          ARG MY_ARG=default
          FROM alpine:3.18
          ARG MY_ARG
          LABEL test-label="hello"
          RUN echo "build arg: $MY_ARG"
          EOF
      - id: build
        uses: .
        with:
          context: /tmp/docker-ctx
          file: /tmp/docker-ctx/Dockerfile
          tags: myimage:test
          labels: |
            org.opencontainers.image.title=TestImage
          build-args: |
            MY_ARG=hello
          no-cache: 'true'
          load: 'true'
          target: ''
      - name: Assert imageid is set
        env:
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          echo "imageid: $IMAGEID"
          if [ -z "$IMAGEID" ]; then
            echo "FAIL: imageid output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert metadata is set
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS"
