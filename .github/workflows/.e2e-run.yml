# reusable workflow
name: .e2e-run

on:
  workflow_call:
    inputs:
      id:
        required: false
        type: string
      type:
        required: true
        type: string
      name:
        required: true
        type: string
      registry:
        required: false
        type: string
      slug:
        required: false
        type: string
      username_secret:
        required: false
        type: string
      password_secret:
        required: false
        type: string

permissions:
  contents: read

env:
  HARBOR_VERSION: v2.13.2
  NEXUS_VERSION: 3.47.1
  DISTRIBUTION_VERSION: 3.0.0

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            buildx_version: edge
            buildkit_image: moby/buildkit:latest
          -
            buildx_version: latest
            buildkit_image: moby/buildkit:buildx-stable-1
          -
            buildx_version: https://github.com/docker/buildx.git#master
            buildkit_image: moby/buildkit:master
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: Set up env
        if: inputs.type == 'local'
        env:
          INPUT_ID: ${{ inputs.id }}
        run: |
          safe_id=$(printf '%s' "$INPUT_ID" | tr -d '\n\r/\\')
          cat "./.github/e2e/${safe_id}/env" >> "$GITHUB_ENV"
      -
        name: Set up BuildKit config
        env:
          INPUT_TYPE: ${{ inputs.type }}
          REGISTRY_FQDN: ${{ env.REGISTRY_FQDN }}
        run: |
          touch /tmp/buildkitd.toml
          if [ "$INPUT_TYPE" = "local" ]; then
            echo -e "[registry.\"$REGISTRY_FQDN\"]\nhttp = true\ninsecure = true" > /tmp/buildkitd.toml
          fi
      -
        name: Set up Docker daemon
        if: inputs.type == 'local'
        env:
          REGISTRY_FQDN: ${{ env.REGISTRY_FQDN }}
        run: |
          if [ ! -e /etc/docker/daemon.json ]; then
            echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          fi
          DOCKERD_CONFIG=$(jq ".+{\"insecure-registries\":[\"http://$REGISTRY_FQDN\"]}" /etc/docker/daemon.json)
          sudo tee /etc/docker/daemon.json <<< "$DOCKERD_CONFIG" >/dev/null
          cat /etc/docker/daemon.json
          sudo service docker restart
      -
        name: Install ${{ inputs.name }}
        if: inputs.type == 'local'
        env:
          INPUT_ID: ${{ inputs.id }}
        run: |
          safe_id=$(printf '%s' "$INPUT_ID" | tr -d '\n\r/\\')
          sudo -E bash "./.github/e2e/${safe_id}/install.sh"
          sudo chown $(id -u):$(id -g) -R ~/.docker
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_SLUG || inputs.slug }}
          tags: |
            type=ref,event=branch,enable=${{ matrix.buildx_version == 'latest' && matrix.buildkit_image == 'moby/buildkit:buildx-stable-1' }}
            type=ref,event=tag,enable=${{ matrix.buildx_version == 'latest' && matrix.buildkit_image == 'moby/buildkit:buildx-stable-1' }}
            type=raw,gh-runid-${{ github.run_id }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ matrix.buildx_version }}
          buildkitd-config: /tmp/buildkitd.toml
          buildkitd-flags: --debug --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
          driver-opts: |
            image=${{ matrix.buildkit_image }}
            network=host
      -
        name: Login to Registry
        if: github.event_name != 'pull_request' && (env.REGISTRY_USER || inputs.username_secret) != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY_FQDN || inputs.registry }}
          username: ${{ env.REGISTRY_USER || secrets[inputs.username_secret] }}
          password: ${{ env.REGISTRY_PASSWORD || secrets[inputs.password_secret] }}
      -
        name: Build and push
        uses: ./
        with:
          context: ./test
          file: ./test/multi.Dockerfile
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_SLUG || inputs.slug }}:master
          cache-to: type=inline
      -
        name: Inspect image
        env:
          REGISTRY_SLUG: ${{ env.REGISTRY_SLUG || inputs.slug }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker pull "$REGISTRY_SLUG:$META_VERSION"
          docker image inspect "$REGISTRY_SLUG:$META_VERSION"
      -
        name: Check manifest
        env:
          REGISTRY_SLUG: ${{ env.REGISTRY_SLUG || inputs.slug }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$REGISTRY_SLUG:$META_VERSION" --format '{{json .}}'
